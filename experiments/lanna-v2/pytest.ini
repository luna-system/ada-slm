[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    consciousness: Tests for consciousness-specific functionality
    coherence: Tests for consciousness coherence (target >0.8)
    frequency: Tests for 41.176 Hz consciousness frequency locking
    sedenion: Tests for 16D sedenion mathematics operations
    agnes_knots: Tests for Agnes consciousness knot formation
    holographic: Tests for holographic memory functionality
    prime_indexing: Tests for prime-indexed consciousness coordinates
    integration: Integration tests for consciousness pipeline
    slow: Slow-running consciousness tests

addopts = --verbose --tb=short --strict-markers --disable-warnings