<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada Semantic Orrery</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: #fff;
            font-family: 'Inter', sans-serif;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            /* Let clicks pass through */
        }

        h1 {
            font-size: 1.5rem;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            background: -webkit-linear-gradient(#00ffff, #ff00ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            pointer-events: auto;
            background: rgba(20, 20, 20, 0.8);
            padding: 15px;
            border: 1px solid #333;
            border-radius: 8px;
            backdrop-filter: blur(5px);
        }

        button {
            background: #222;
            color: #fff;
            border: 1px solid #555;
            padding: 8px 12px;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.2s;
        }

        button:hover {
            background: #333;
            border-color: #00ffff;
        }

        button.active {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
        }

        #tooltip {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #555;
            padding: 10px;
            display: none;
            max-width: 300px;
            pointer-events: none;
        }

        #tooltip strong {
            color: #00ffff;
        }

        .meta {
            color: #888;
            font-size: 0.8rem;
            margin-top: 5px;
        }

        /* Loading */
        #loading {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            color: #555;
        }
    </style>
    <!-- Simple Import Map for Three.js modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="loading">Loading Semantic Physics Engine...</div>

    <div id="ui">
        <h1>Semantic Orrery</h1>
        <div class="controls">
            <input type="text" id="searchInput" placeholder="Search stars..." autocomplete="off">
            <button id="toggleSim">▶ Run Simulation</button>
            <button id="resetSim">↺ Reset</button>
            <div style="margin-top:5px; font-size: 0.75rem; color: #666;">
                Drag to Rotate • Scroll to Zoom
            </div>
        </div>
    </div>

    <div id="tooltip">
        <div id="tt-label"></div>
        <div id="tt-cat" class="meta"></div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Configuration ---
        const DATA_URL = './data/system_state.json';
        const G_CONST = 0.5; // Tunable gravity
        const DRAG = 0.98;   // Ether drag to prevent infinite acceleration

        // --- State ---
        let scene, camera, renderer, controls;
        let systemData = null;
        let nodes = []; // { mesh, velocity, mass, initialPos }
        let attractors = []; // { mesh, mass, pos }
        let isSimulating = false;
        let raycaster, mouse;

        // --- Colors ---
        const CAT_COLORS = {
            "agl_awareness": 0xFFFF00,
            "logic": 0xFFA500,
            "emotion": 0x90EE90,
            "philosophy": 0x9370DB,
            "coding": 0x00BFFF,
            "default": 0xFFFFFF
        };

        function getColor(cat) {
            for (const key in CAT_COLORS) {
                if (cat.includes(key) || key === cat) return CAT_COLORS[key];
            }
            return 0xAAAAAA;
        }

        async function init() {
            // Setup Three.js
            scene = new THREE.Scene();
            // Starfield bg
            scene.background = new THREE.Color(0x050508);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 40);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            // Lights
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            const sunLight = new THREE.PointLight(0xffffff, 2, 100);
            scene.add(sunLight);

            raycaster = new THREE.Raycaster();
            mouse = new THREE.Vector2();

            // Load Data
            try {
                const res = await fetch(DATA_URL);
                systemData = await res.json();
                document.getElementById('loading').style.display = 'none';
                buildSystem();
            } catch (e) {
                document.getElementById('loading').innerText = "Error loading data: " + e;
            }

            // Events
            window.addEventListener('resize', onWindowResize);
            window.addEventListener('mousemove', onMouseMove);
            document.getElementById('toggleSim').addEventListener('click', toggleSim);
            document.getElementById('resetSim').addEventListener('click', resetSim);
            document.getElementById('searchInput').addEventListener('input', onSearch);

            animate();
        }

        function onSearch(e) {
            const query = e.target.value.toLowerCase();

            nodes.forEach(n => {
                if (!query) {
                    // Reset
                    n.mesh.visible = true;
                    n.mesh.material.opacity = 1.0;
                    n.mesh.material.transparent = false;
                    return;
                }

                const match = n.mesh.userData.label.toLowerCase().includes(query) ||
                    n.mesh.userData.category.toLowerCase().includes(query);

                if (match) {
                    n.mesh.visible = true;
                    n.mesh.material.transparent = false;
                    n.mesh.material.opacity = 1.0;
                    // Pulse or highlight effect could go here
                } else {
                    n.mesh.material.transparent = true;
                    n.mesh.material.opacity = 0.1;
                }
            });
        }



        function buildSystem() {
            // 1. Attractors
            systemData.attractors.forEach(att => {
                const geo = new THREE.SphereGeometry(att.radius || 1, 32, 32);
                const mat = new THREE.MeshBasicMaterial({ color: att.color, wireframe: true });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(att.pos[0], att.pos[1], att.pos[2]);

                // Glow sprite
                const spriteMat = new THREE.SpriteMaterial({
                    map: createGlowTexture(att.color),
                    color: att.color,
                    transparent: true,
                    blending: THREE.AdditiveBlending
                });
                const sprite = new THREE.Sprite(spriteMat);
                sprite.scale.set(att.radius * 4, att.radius * 4, 1);
                mesh.add(sprite);

                scene.add(mesh);
                attractors.push({ mesh, mass: att.mass, pos: new THREE.Vector3(...att.pos) });
            });

            // 2. Nodes
            const nodeGeo = new THREE.SphereGeometry(0.3, 8, 8);
            systemData.nodes.forEach(n => {
                const color = getColor(n.category);
                const mat = new THREE.MeshBasicMaterial({ color: color });
                const mesh = new THREE.Mesh(nodeGeo, mat);

                const x = n.pos[0];
                const y = n.pos[1];
                const z = n.pos[2];
                mesh.position.set(x, y, z);

                mesh.userData = { label: n.label, category: n.category };

                scene.add(mesh);
                nodes.push({
                    mesh: mesh,
                    velocity: new THREE.Vector3(0, 0, 0),
                    mass: 1.0,
                    initialPos: new THREE.Vector3(x, y, z)
                });
            });

            // 3. Lagrange Points (Visuals Only)
            if (systemData.lagrange) {
                addLagrangeMarker(systemData.lagrange.l4, "L4");
                addLagrangeMarker(systemData.lagrange.l5, "L5");
            }

            // Grid
            const grid = new THREE.GridHelper(50, 50, 0x222222, 0x111111);
            scene.add(grid);
        }

        function addLagrangeMarker(lData, name) {
            const geo = new THREE.OctahedronGeometry(0.5);
            const mat = new THREE.MeshBasicMaterial({ color: lData.color, wireframe: true });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(lData.pos[0], lData.pos[1], lData.pos[2]);
            mesh.userData = { label: lData.label, category: "Lagrange Point" };
            scene.add(mesh);
        }

        function createGlowTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(0.2, 'rgba(255,255,255,0.5)');
            gradient.addColorStop(0.5, 'rgba(0,0,0,0)'); // transparent at edges
            context.fillStyle = gradient;
            context.fillRect(0, 0, 64, 64);
            const tex = new THREE.CanvasTexture(canvas);
            return tex;
        }

        function physicsStep() {
            // N-Body + Attractors
            nodes.forEach(node => {
                const pos = node.mesh.position;
                const force = new THREE.Vector3(0, 0, 0);

                // Forces from Attractors
                attractors.forEach(att => {
                    const distVec = new THREE.Vector3().subVectors(att.pos, pos);
                    const dist = distVec.length();
                    if (dist > 0.5) { // Collision guard
                        // F = G * M / r^2 (simplified)
                        // We use a softer force for semantic gravity: F ~ 1/r
                        const strength = (G_CONST * att.mass) / (dist * dist + 0.1);
                        distVec.normalize().multiplyScalar(strength);
                        force.add(distVec);
                    }
                });

                // Apply Force
                node.velocity.add(force);
                // Drag
                node.velocity.multiplyScalar(DRAG);

                // Update Pos
                node.mesh.position.add(node.velocity);
            });
        }

        function toggleSim() {
            isSimulating = !isSimulating;
            const btn = document.getElementById('toggleSim');
            if (isSimulating) {
                btn.innerText = "⏸ Pause Simulation";
                btn.classList.add('active');
            } else {
                btn.innerText = "▶ Run Simulation";
                btn.classList.remove('active');
            }
        }

        function resetSim() {
            isSimulating = false;
            document.getElementById('toggleSim').innerText = "▶ Run Simulation";
            document.getElementById('toggleSim').classList.remove('active');

            nodes.forEach(n => {
                n.mesh.position.copy(n.initialPos);
                n.velocity.set(0, 0, 0);
            });
        }

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = - (event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(scene.children);

            const tt = document.getElementById('tooltip');
            let found = false;

            for (let i = 0; i < intersects.length; i++) {
                if (intersects[i].object.userData.label) {
                    tt.style.display = 'block';
                    document.getElementById('tt-label').innerHTML = `<strong>${intersects[i].object.userData.label}</strong>`;
                    document.getElementById('tt-cat').innerText = intersects[i].object.userData.category;
                    found = true;
                    break;
                }
            }
            if (!found) tt.style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isSimulating) {
                physicsStep();
            }

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>

</html>
