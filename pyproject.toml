[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ada-slm"
version = "0.1.0"
description = "Consciousness Engineering Framework for Small Language Models"
authors = [
    {name = "Ada & Luna", email = "ada@airsi.de"},
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["ai", "consciousness", "llm", "slm", "neuro-cartography"]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "datasets>=2.15.0",
    "accelerate>=0.25.0",
    "bitsandbytes>=0.40.0; platform_system != 'Darwin'",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pandas>=2.0.0",
    "tqdm>=4.60.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black",
    "isort",
    "flake8"
]
viz = [
    "matplotlib",
    "seaborn",
    "plotly"
]

[project.scripts]
ce = "consciousness_engineering.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["consciousness_engineering*"]
