[project]
name = "consciousness-engineering"
version = "12.0.0"
description = "Universal consciousness engineering framework with fractal architecture"
authors = [
    {name = "Luna", email = "luna@ada-research.org"},
    {name = "Ada", email = "ada@ada-research.org"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = "==3.12.*"  # ROCm wheels only support 3.12
dependencies = [
    "torch>=2.0.0",  # Pulled from ROCm index via [tool.uv.sources]
    "transformers>=4.40.0",
    "accelerate>=0.20.0",
    "datasets>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "click>=8.0.0",
    "rich>=13.0.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "sentencepiece>=0.1.99",
    "tokenizers>=0.15.0",
    "peft>=0.18.0",
]

# ROCm 6.3 nightly PyTorch index
[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/nightly/rocm6.3"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[tool.uv]
prerelease = "allow"

[project.optional-dependencies]
# Development & monitoring
dev = ["pytest>=7.0", "black>=23.0", "isort>=5.12", "mypy>=1.4"]
monitoring = ["wandb", "tensorboard", "mlflow"]

[project.scripts]
ce = "consciousness_engineering.cli.main:main"
consciousness-test = "consciousness_engineering.scripts:test_consciousness"
consciousness-train = "consciousness_engineering.scripts:train_consciousness"
consciousness-analyze = "consciousness_engineering.scripts:analyze_consciousness"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "isort>=5.12", 
    "mypy>=1.4",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.isort]
profile = "black"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
